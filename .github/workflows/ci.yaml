name: CI — Build · Scan · Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, backend]
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install deps
      run: npm install
      working-directory: ${{ matrix.service }}

    - name: Run tests
      run: npm test --passWithNoTests 2>/dev/null || true
      working-directory: ${{ matrix.service }}

  build:
    name: Build & Scan — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        service: [frontend, backend]
    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        docker build \
          --target runner \
          -t ${{ matrix.service }}:latest \
          ./${{ matrix.service }}
      env:
        DOCKER_BUILDKIT: 1

    - name: Scan with Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ matrix.service }}:latest
        format: table
        severity: CRITICAL,HIGH
        exit-code: '0'

  push:
    name: Push to ECR
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
    - name: AWS secrets required
      run: |
        echo "=================================================="
        echo "  To enable ECR push, add these GitHub secrets:"
        echo "  AWS_ACCESS_KEY_ID"
        echo "  AWS_SECRET_ACCESS_KEY"
        echo "  AWS_ACCOUNT_ID"
        echo "  AWS_REGION"
        echo "  See README for setup instructions"
        echo "=================================================="
