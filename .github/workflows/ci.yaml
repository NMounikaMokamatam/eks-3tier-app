name: CI — Build · Scan · Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION:   ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
  CLUSTER_NAME: eks-3tier-cluster

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, backend]
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install deps
      run: npm install
      working-directory: ${{ matrix.service }}

    - name: Run tests
      run: npm test --passWithNoTests 2>/dev/null || true
      working-directory: ${{ matrix.service }}

  build-push:
    name: Build & Push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [frontend, backend]
    permissions:
      id-token: write
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region:            ${{ env.AWS_REGION }}

    - name: Login to ECR
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set image tag
      id: meta
      run: |
        SHORT_SHA=${GITHUB_SHA::7}
        echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
        echo "image=${ECR_REGISTRY}/${{ env.CLUSTER_NAME }}/${{ matrix.service }}:${SHORT_SHA}" >> $GITHUB_OUTPUT

    - name: Build Docker image
      run: |
        docker build \
          --target runner \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          -t ${{ steps.meta.outputs.image }} \
          -t ${ECR_REGISTRY}/${{ env.CLUSTER_NAME }}/${{ matrix.service }}:latest \
          ./${{ matrix.service }}
      env:
        DOCKER_BUILDKIT: 1

    - name: Scan with Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ steps.meta.outputs.image }}
        format: sarif
        output: trivy-${{ matrix.service }}.sarif
        severity: CRITICAL,HIGH
        exit-code: '1'

    - name: Upload Trivy results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: trivy-${{ matrix.service }}.sarif

    - name: Push to ECR
      run: |
        docker push ${{ steps.meta.outputs.image }}
        docker push ${ECR_REGISTRY}/${{ env.CLUSTER_NAME }}/${{ matrix.service }}:latest

    - name: Update K8s manifest
      run: |
        sed -i "s|IMAGE_TAG|${{ steps.meta.outputs.tag }}|g" k8s/${{ matrix.service }}/deployment.yaml
        sed -i "s|ACCOUNT_ID|${{ secrets.AWS_ACCOUNT_ID }}|g" k8s/${{ matrix.service }}/deployment.yaml
        sed -i "s|REGION|${{ env.AWS_REGION }}|g" k8s/${{ matrix.service }}/deployment.yaml

    - name: Commit updated manifests
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add k8s/${{ matrix.service }}/deployment.yaml
        git diff --staged --quiet || git commit -m "ci: update ${{ matrix.service }} to ${{ steps.meta.outputs.tag }} [skip ci]"
        git push

  deploy:
    name: Sync ArgoCD
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/main'
    steps:
    - name: Install ArgoCD CLI
      run: |
        curl -sSL -o /usr/local/bin/argocd \
          https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
        chmod +x /usr/local/bin/argocd

    - name: Sync application
      run: |
        argocd app sync eks-3tier-app \
          --auth-token ${{ secrets.ARGOCD_TOKEN }} \
          --server     ${{ secrets.ARGOCD_SERVER }} \
          --grpc-web --timeout 120
        argocd app wait eks-3tier-app \
          --auth-token ${{ secrets.ARGOCD_TOKEN }} \
          --server     ${{ secrets.ARGOCD_SERVER }} \
          --grpc-web --timeout 180
